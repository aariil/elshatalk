<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELSHA - English AI Companion</title>
  
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background-color: #0f172a; color: #f8fafc; }
    .cl-hidden { display: none !important; }
    
    /* ELSHA Modal Theme (Indigo & Cyan) */
    .elsha-overlay {
      position: fixed; inset: 0; display: flex; justify-content: center; align-items: center;
      z-index: 99999; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); padding: 16px;
    }
    .elsha-card {
      background: #1e293b; border: 1px solid #334155; border-radius: 20px;
      padding: 32px 24px; max-width: 420px; width: 100%; text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .elsha-input {
      width: 100%; padding: 14px; border: 1px solid #475569; border-radius: 10px;
      background: #0f172a; color: #fff; font-size: 1rem; text-align: center;
      outline: none; transition: border-color 0.2s; font-family: monospace;
    }
    .elsha-input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3); }
    .elsha-btn {
      width: 100%; margin-top: 16px; padding: 14px; border: none; border-radius: 10px;
      background: linear-gradient(90deg, #6366f1, #06b6d4); color: white;
      font-weight: 700; font-size: 16px; cursor: pointer; transition: opacity 0.2s;
    }
    .elsha-btn:hover { opacity: 0.9; }
  </style>

  <!-- Fast Hide Script (Mencegah Kedipan Modal saat Sesi Aktif) -->
  <script>
    (function(){
      var appID = "elsha_app";
      var savedKey = localStorage.getItem('elsha_gemini_key') || sessionStorage.getItem('elsha_gemini_key');
      if (savedKey) {
        var style = document.createElement('style');
        style.id = 'elsha-fast-hide';
        style.innerText = '#elsha-lock-modal { display: none !important; }';
        (document.head || document.documentElement).appendChild(style);
      }
    })();
  </script>
</head>
<body>

  <!-- Modal Unlock ELSHA -->
  <div id="elsha-lock-modal" class="elsha-overlay">
    <div class="elsha-card">
      <div style="font-size: 40px; margin-bottom: 10px;">🤖</div>
      <h2 style="margin: 0 0 8px; font-size: 1.5rem; color: #f8fafc;">ELSHA AI</h2>
      <p style="margin: 0 0 20px; color: #94a3b8; font-size: 0.9rem;">Masukkan Gemini API Key untuk memulai sesi belajar English AI</p>

      <div id="elsha-error" class="cl-hidden" style="background: rgba(239, 68, 68, 0.2); color: #fca5a5; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 13px;"></div>

      <input type="password" id="gemini-key-input" class="elsha-input" placeholder="AIzaSy...">
      <button type="button" id="btn-unlock" class="elsha-btn">Buka ELSHA AI</button>
    </div>
  </div>

  <!-- Aplikasi Utama ELSHA (Akan Tampil Setelah Key Valid) -->
  <div id="elsha-main-app" class="cl-hidden" style="padding: 20px;">
    <h1>Welcome to ELSHA AI 🚀</h1>
    <p>English Voice, Chat, Translator & Game Dashboard.</p>
    <button onclick="testGeminiCall()">Coba Tes Gemini API</button>
    <div id="api-output" style="margin-top:15px; background:#1e293b; padding:15px; border-radius:8px;"></div>
  </div>

  <!-- Logika Integrasi Gemini & Storage Lapis 5 -->
  <script>
    let geminiApiKey = "";

    (function() {
      const APP_PREFIX = "elsha_";

      function getEl(id) { return document.getElementById(id); }

      // Multi-Layer Storage
      function saveKey(key) {
        try { localStorage.setItem(APP_PREFIX + 'gemini_key', key); } catch(e){}
        try { sessionStorage.setItem(APP_PREFIX + 'gemini_key', key); } catch(e){}
        try { document.cookie = APP_PREFIX + 'gemini_key=' + encodeURIComponent(key) + '; path=/; max-age=31536000'; } catch(e){}
      }

      function loadSavedKey() {
        try {
          var k = localStorage.getItem(APP_PREFIX + 'gemini_key') || sessionStorage.getItem(APP_PREFIX + 'gemini_key');
          if (k) return k;
          var match = document.cookie.match('(^|;) ?' + APP_PREFIX + 'gemini_key=([^;]*)(;|$)');
          if (match) return decodeURIComponent(match[2]);
        } catch(e){}
        return null;
      }

      function unlockApp(key) {
        geminiApiKey = key;
        const fastHide = getEl('elsha-fast-hide');
        if (fastHide) fastHide.remove();

        getEl('elsha-lock-modal').classList.add('cl-hidden');
        getEl('elsha-main-app').classList.remove('cl-hidden');
        saveKey(key);
      }

      async function validateAndUnlock() {
        const inputKey = getEl('gemini-key-input').value.trim();
        const errDiv = getEl('elsha-error');

        if (!inputKey) {
          errDiv.innerText = "API Key tidak boleh kosong!";
          errDiv.classList.remove('cl-hidden');
          return;
        }

        // Tes langsung ke Endpoint Gemini API untuk validasi
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${inputKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: "Hello" }] }] })
          });

          if (res.ok) {
            unlockApp(inputKey);
          } else {
            errDiv.innerText = "Gemini API Key tidak valid. Cek kembali key kamu.";
            errDiv.classList.remove('cl-hidden');
          }
        } catch (e) {
          errDiv.innerText = "Gagal terhubung ke Gemini API.";
          errDiv.classList.remove('cl-hidden');
        }
      }

      // Event Listeners
      getEl('btn-unlock').addEventListener('click', validateAndUnlock);
      getEl('gemini-key-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') validateAndUnlock();
      });

      // Auto Unlock jika Key Sudah Ada
      const saved = loadSavedKey();
      if (saved) {
        unlockApp(saved);
      }
    })();

    // Fungsi Penggunaan Gemini API di Modul-Modul ELSHA
    async function testGeminiCall() {
      const output = document.getElementById('api-output');
      output.innerText = "Sedang memproses dengan Gemini...";

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: "Berikan 1 kalimat motivasi belajar bahasa Inggris dalam 1 kalimat." }] }]
          })
        });

        const data = await response.json();
        const reply = data.candidates[0].content.parts[0].text;
        output.innerText = reply;
      } catch (err) {
        output.innerText = "Error memanggil Gemini API.";
      }
    }
  </script>
</body>
</html>
