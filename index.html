<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Master AI</title>
  <style>
    :root { --primary: #4F46E5; --bg-color: #F3F4F6; --chat-bg: #FFFFFF; --text-main: #1F2937; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; height: 100vh; }
    .welcome-screen { background: white; padding: 40px; border-radius: 20px; text-align: center; max-width: 400px; width: 90%; }
    .welcome-screen h1 { color: var(--primary); margin-bottom: 10px; }
    .welcome-screen input { width: 100%; padding: 15px; border: 2px solid #E5E7EB; border-radius: 10px; margin-bottom: 20px; text-align: center; }
    .welcome-screen button { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    .app-container { width: 100%; max-width: 600px; height: 95vh; background: var(--chat-bg); border-radius: 20px; display: none; flex-direction: column; overflow: hidden; }
    .header { background: var(--primary); color: white; text-align: center; padding: 20px; }
    .level-tabs { display: flex; background: #E0E7FF; padding: 10px; justify-content: space-around; }
    .level-btn { background: transparent; border: none; padding: 8px 15px; font-weight: bold; color: var(--primary); cursor: pointer; }
    .level-btn.active { background: var(--primary); color: white; border-radius: 20px; }
    .chat-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background: #FAFAFA; }
    .message { max-width: 85%; padding: 12px 18px; border-radius: 15px; line-height: 1.5; }
    .message.ai { align-self: flex-start; background: white; border: 1px solid #E5E7EB; }
    .message.user { align-self: flex-end; background: var(--primary); color: white; }
    .btn-suara { display: inline-block; margin-top: 10px; background: #E0E7FF; color: var(--primary); border: none; padding: 5px 10px; border-radius: 10px; cursor: pointer; }
    .input-area { display: flex; padding: 15px 20px; background: white; border-top: 1px solid #E5E7EB; gap: 10px; }
    .input-area input { flex: 1; padding: 12px 15px; border: 1px solid #D1D5DB; border-radius: 25px; }
    .mic-btn { background: #F3F4F6; border: 1px solid #D1D5DB; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; }
    .input-area .send-btn { background: var(--primary); color: white; border: none; padding: 0 20px; border-radius: 25px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="welcome-screen" id="welcomeScreen">
    <h1>English AI!</h1>
    <input type="text" id="studentNameInput" placeholder="Siapa nama Anda?">
    <button onclick="startApp()">Mulai Belajar</button>
  </div>
  <div class="app-container" id="appContainer">
    <div class="header"><h1>English Master AI</h1></div>
    <div class="level-tabs">
      <button class="level-btn active" onclick="changeLevel('pemula', this)">Pemula</button>
      <button class="level-btn" onclick="changeLevel('menengah', this)">Menengah</button>
      <button class="level-btn" onclick="changeLevel('pro', this)">Pro</button>
    </div>
    <div class="chat-area" id="chatBox"></div>
    <div class="input-area">
      <button class="mic-btn" onclick="toggleMic()">🎤</button>
      <input type="text" id="userInput" placeholder="Ketik pesan...">
      <button class="send-btn" onclick="sendMessage()">Kirim</button>
    </div>
  </div>

  <script>
    const API_KEY = "AQ.Ab8RN6IskHyAd736lMv4VIG4naIm0xGYIh5ZIf7nUtSR9qhCuA"; 
    let currentLevel = 'pemula';
    let studentName = '';
    const levelInstructions = { pemula: "Guru bahasa Inggris pemula.", menengah: "Tutor menengah.", pro: "Advanced English coach." };

    function startApp() {
      studentName = document.getElementById('studentNameInput').value.trim() || "Siswa";
      document.getElementById('welcomeScreen').style.display = 'none';
      document.getElementById('appContainer').style.display = 'flex';
      document.getElementById('chatBox').innerHTML = `<div class="message ai">Halo ${studentName}! Mari belajar.</div>`;
    }

    function changeLevel(level, btnElement) {
      currentLevel = level;
      document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
    }

    function toggleMic() { alert("Mikrofon diklik. Fitur ini aman."); }

    async function sendMessage() {
      const inputField = document.getElementById('userInput');
      const chatBox = document.getElementById('chatBox');
      const text = inputField.value.trim();
      if (!text) return;

      chatBox.innerHTML += `<div class="message user">${text}</div>`;
      inputField.value = '';
      const loadingId = 'load-' + Date.now();
      chatBox.innerHTML += `<div class="message ai" id="${loadingId}">...</div>`;
      
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: levelInstructions[currentLevel] }] },
            contents: [{ parts: [{ text: text }] }]
          })
        });
        
        const data = await response.json();
        
        // Menangkap pesan error asli dari Google jika ada kegagalan
        if (!response.ok) {
          throw new Error(data.error ? data.error.message : "Gagal menghubungi server Google.");
        }

        const reply = data.candidates[0].content.parts[0].text;
        document.getElementById(loadingId).remove();
        chatBox.innerHTML += `<div class="message ai">${reply.replace(/\n/g, '<br>')}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
      } catch (error) {
        document.getElementById(loadingId).remove();
        // Menampilkan pesan error asli di layar aplikasi
        chatBox.innerHTML += `<div class="message ai" style="color:red; border-color:red;"><b>INFO ERROR:</b> ${error.message}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }
  </script>
</body>
</html>
