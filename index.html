<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Master AI</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338ca;
      --bg-color: #F3F4F6;
      --chat-bg: #FFFFFF;
      --text-main: #1F2937;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* --- LAYAR SAMBUTAN --- */
    .welcome-screen {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    .welcome-screen h1 { color: var(--primary); margin-bottom: 10px; font-size: 1.8rem; }
    .welcome-screen p { margin-bottom: 25px; color: #6B7280; }
    .welcome-screen input {
      width: 100%;
      padding: 15px;
      border: 2px solid #E5E7EB;
      border-radius: 10px;
      font-size: 1.1rem;
      margin-bottom: 20px;
      outline: none;
      text-align: center;
    }
    .welcome-screen input:focus { border-color: var(--primary); }
    .welcome-screen button {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 15px;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    .welcome-screen button:hover { background: var(--primary-hover); }

    /* --- APLIKASI CHAT (Disembunyikan di awal) --- */
    .app-container {
      width: 100%;
      max-width: 600px;
      height: 95vh;
      background: var(--chat-bg);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      display: none; /* Disembunyikan sampai nama dimasukkan */
      flex-direction: column;
      overflow: hidden;
    }

    .header { background: var(--primary); color: white; text-align: center; padding: 20px; }
    .header h1 { font-size: 1.5rem; margin-bottom: 5px; }
    .header p { font-size: 0.9rem; opacity: 0.8; }

    .level-tabs { display: flex; background: #E0E7FF; padding: 10px; justify-content: space-around; }
    .level-btn {
      background: transparent; border: 2px solid transparent; padding: 8px 15px;
      border-radius: 20px; font-weight: bold; color: var(--primary); cursor: pointer; transition: all 0.3s ease;
    }
    .level-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }

    .chat-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background: #FAFAFA; }
    .message { max-width: 80%; padding: 12px 18px; border-radius: 15px; line-height: 1.5; font-size: 0.95rem; animation: fadeIn 0.3s ease-in-out; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.ai { align-self: flex-start; background: white; border: 1px solid #E5E7EB; border-bottom-left-radius: 2px; color: #374151; }
    .message.user { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 2px; }

    .input-area { display: flex; padding: 15px 20px; background: white; border-top: 1px solid #E5E7EB; gap: 10px; }
    .input-area input { flex: 1; padding: 12px 15px; border: 1px solid #D1D5DB; border-radius: 25px; outline: none; font-size: 1rem; }
    .input-area input:focus { border-color: var(--primary); }
    .input-area button { background: var(--primary); color: white; border: none; padding: 0 20px; border-radius: 25px; font-weight: bold; cursor: pointer; }
    .input-area button:hover { background: var(--primary-hover); }
    .loading-text { font-size: 0.85rem; color: #6B7280; font-style: italic; }

  </style>
</head>
<body>

  <!-- Tampilan Input Nama -->
  <div class="welcome-screen" id="welcomeScreen">
    <h1>Selamat Datang!</h1>
    <p>Sebelum mulai, siapa nama Anda?</p>
    <input type="text" id="studentNameInput" placeholder="Contoh: Ilham" autocomplete="off">
    <button onclick="startApp()">Mulai Belajar</button>
  </div>

  <!-- Tampilan Aplikasi Chat Utama -->
  <div class="app-container" id="appContainer">
    <div class="header">
      <h1>English Master AI</h1>
      <p>Latihan Percakapan & Grammar</p>
    </div>

    <div class="level-tabs">
      <button class="level-btn active" onclick="changeLevel('pemula', this)">Pemula</button>
      <button class="level-btn" onclick="changeLevel('menengah', this)">Menengah</button>
      <button class="level-btn" onclick="changeLevel('pro', this)">Pro</button>
    </div>

    <div class="chat-area" id="chatBox">
      <!-- Pesan ucapan pertama akan muncul di sini secara otomatis -->
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="Ketik pesan di sini..." autocomplete="off">
      <button onclick="sendMessage()">Kirim</button>
    </div>
  </div>

  <script>
    // ---------------------------------------------------------
    // MASUKKAN API KEY ANDA DI BAWAH INI (Di antara tanda kutip)
    // ---------------------------------------------------------
    const API_KEY = "AQ.Ab8RN6IskHyAd736lMv4VIG4naIm0xGYIh5ZIf7nUtSR9qhCuA"; 
    
    let currentLevel = 'pemula';
    let studentName = '';
    
    const levelInstructions = {
      pemula: "Kamu adalah guru bahasa Inggris yang sangat ramah dan sabar. Muridmu adalah pemula (beginner). Gunakan bahasa Indonesia secara dominan untuk menjelaskan aturan grammar dasar. Selalu terjemahkan setiap contoh kalimat bahasa Inggris ke bahasa Indonesia. Perbaiki kesalahan murid dengan lembut.",
      menengah: "Kamu adalah tutor bahasa Inggris untuk tingkat menengah (intermediate). Gunakan 70% bahasa Inggris dan 30% bahasa Indonesia. Ajak murid berdiskusi, perkenalkan idiom yang umum dipakai sehari-hari, dan perbaiki tata bahasa mereka dengan penjelasan yang terstruktur.",
      pro: "You are an advanced English conversation partner and coach. Your student is highly proficient (advanced). You MUST communicate 100% in English. Do not use Indonesian. Challenge the user with complex vocabulary, native-level idioms, and phrasal verbs. Correct any subtle unnatural phrasing to make them sound like a native speaker."
    };

    // Fungsi saat tombol "Mulai Belajar" diklik
    function startApp() {
      const nameInput = document.getElementById('studentNameInput').value.trim();
      
      if (!nameInput) {
        alert("Silakan isi nama Anda terlebih dahulu ya!");
        return;
      }
      
      studentName = nameInput;
      
      // Sembunyikan layar awal, tampilkan aplikasi chat
      document.getElementById('welcomeScreen').style.display = 'none';
      document.getElementById('appContainer').style.display = 'flex';

      // Menentukan Waktu (Pagi/Siang/Sore/Malam)
      const hour = new Date().getHours();
      let waktu = "malam";
      if (hour >= 4 && hour < 11) waktu = "pagi";
      else if (hour >= 11 && hour < 15) waktu = "siang";
      else if (hour >= 15 && hour < 18) waktu = "sore";

      // Buat Ucapan Otomatis
      const greetingMsg = `Selamat ${waktu} <b>${studentName}</b>, sudah siap belajar bahasa Inggris bersama saya? Pilih level di atas dan mari kita mulai!`;
      document.getElementById('chatBox').innerHTML = `<div class="message ai">${greetingMsg}</div>`;
    }

    // Fungsi ganti level
    function changeLevel(level, btnElement) {
      currentLevel = level;
      document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      const chatBox = document.getElementById('chatBox');
      const levelName = level === 'pemula' ? 'Pemula' : level === 'menengah' ? 'Menengah' : 'Pro';
      chatBox.innerHTML += `<div class="message ai" style="background:#E0E7FF; border:none; text-align:center; align-self:center; width:100%;">Tingkat kesulitan diubah ke: <b>${levelName}</b></div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Fungsi kirim pesan ke AI
    async function sendMessage() {
      const inputField = document.getElementById('userInput');
      const chatBox = document.getElementById('chatBox');
      const text = inputField.value.trim();
      
      if (!text) return;
      if (API_KEY === "AQ.Ab8RN6IskHyAd736lMv4VIG4naIm0xGYIh5ZIf7nUtSR9qhCuA") {
        alert("PERHATIAN: Anda belum memasukkan API Key di dalam kode JavaScript!");
        return;
      }

      chatBox.innerHTML += `<div class="message user">${text}</div>`;
      inputField.value = '';
      
      const loadingId = 'load-' + Date.now();
      chatBox.innerHTML += `<div class="message ai loading-text" id="${loadingId}">AI sedang mengetik...</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;

      // Injeksi nama siswa ke dalam instruksi AI agar AI mengingatnya
      const finalInstruction = levelInstructions[currentLevel] + `\n\nPENTING: Nama murid yang sedang kamu ajar saat ini adalah "${studentName}". Ingat namanya dan sesekali panggil dia dengan ramah.`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            system_instruction: {
              parts: [{ text: finalInstruction }]
            },
            contents: [{ parts: [{ text: text }] }]
          })
        });
        
        const data = await response.json();
        if(data.error) throw new Error(data.error.message);

        const reply = data.candidates[0].content.parts[0].text;
        
        document.getElementById(loadingId).remove();
        const formattedReply = reply.replace(/\n/g, '<br>');
        chatBox.innerHTML += `<div class="message ai">${formattedReply}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
        
      } catch (error) {
        document.getElementById(loadingId).remove();
        chatBox.innerHTML += `<div class="message ai" style="color:red;">Error: Gagal terhubung ke AI. Detail: ${error.message}</div>`;
      }
    }

    // Mendukung pengiriman pesan dengan tombol Enter
    document.getElementById("userInput").addEventListener("keypress", function(e) {
      if (e.key === "Enter") sendMessage();
    });
    
    document.getElementById("studentNameInput").addEventListener("keypress", function(e) {
      if (e.key === "Enter") startApp();
    });
  </script>
</body>
</html>
