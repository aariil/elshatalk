<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Master AI</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338ca;
      --bg-color: #F3F4F6;
      --chat-bg: #FFFFFF;
      --text-main: #1F2937;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .welcome-screen {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    .welcome-screen h1 { color: var(--primary); margin-bottom: 10px; font-size: 1.8rem; }
    .welcome-screen p { margin-bottom: 25px; color: #6B7280; }
    .welcome-screen input {
      width: 100%; padding: 15px; border: 2px solid #E5E7EB; border-radius: 10px;
      font-size: 1.1rem; margin-bottom: 20px; outline: none; text-align: center;
    }
    .welcome-screen input:focus { border-color: var(--primary); }
    .welcome-screen button {
      width: 100%; background: var(--primary); color: white; border: none;
      padding: 15px; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer;
    }

    .app-container {
      width: 100%; max-width: 600px; height: 95vh; background: var(--chat-bg);
      border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      display: none; flex-direction: column; overflow: hidden;
    }

    .header { background: var(--primary); color: white; text-align: center; padding: 20px; position: relative;}
    .header h1 { font-size: 1.5rem; margin-bottom: 5px; }
    .header p { font-size: 0.9rem; opacity: 0.8; }

    .level-tabs { display: flex; background: #E0E7FF; padding: 10px; justify-content: space-around; }
    .level-btn {
      background: transparent; border: 2px solid transparent; padding: 8px 15px;
      border-radius: 20px; font-weight: bold; color: var(--primary); cursor: pointer; transition: all 0.3s ease;
    }
    .level-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }

    .chat-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background: #FAFAFA; }
    .message { max-width: 85%; padding: 12px 18px; border-radius: 15px; line-height: 1.5; font-size: 0.95rem; }
    .message.ai { align-self: flex-start; background: white; border: 1px solid #E5E7EB; border-bottom-left-radius: 2px; color: #374151; }
    .message.user { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 2px; }
    
    .btn-suara {
      display: inline-block; margin-top: 10px; font-size: 0.8rem; background: #E0E7FF;
      color: var(--primary); border: none; padding: 5px 10px; border-radius: 10px; cursor: pointer; font-weight: bold;
    }

    .input-area { display: flex; padding: 15px 20px; background: white; border-top: 1px solid #E5E7EB; gap: 10px; align-items: center;}
    .input-area input { flex: 1; padding: 12px 15px; border: 1px solid #D1D5DB; border-radius: 25px; outline: none; font-size: 1rem; }
    .input-area input:focus { border-color: var(--primary); }
    
    /* Tombol Mic Baru */
    .mic-btn {
      background: #F3F4F6; color: #374151; border: 1px solid #D1D5DB; border-radius: 50%;
      width: 45px; height: 45px; display: flex; justify-content: center; align-items: center;
      font-size: 1.2rem; cursor: pointer; transition: 0.3s;
    }
    .mic-btn.recording { background: #EF4444; color: white; border-color: #EF4444; animation: pulse 1s infinite; }
    
    .input-area .send-btn { background: var(--primary); color: white; border: none; padding: 0 20px; height: 45px; border-radius: 25px; font-weight: bold; cursor: pointer; }
    
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    .loading-text { font-size: 0.85rem; color: #6B7280; font-style: italic; }

  </style>
</head>
<body>

  <div class="welcome-screen" id="welcomeScreen">
    <h1>Selamat Datang!</h1>
    <p>Sebelum mulai, siapa nama Anda?</p>
    <input type="text" id="studentNameInput" placeholder="Contoh: Ilham" autocomplete="off">
    <button onclick="startApp()">Mulai Belajar</button>
  </div>

  <div class="app-container" id="appContainer">
    <div class="header">
      <h1>English Master AI</h1>
      <p>Latihan Percakapan & Grammar</p>
    </div>

    <div class="level-tabs">
      <button class="level-btn active" onclick="changeLevel('pemula', this)">Pemula</button>
      <button class="level-btn" onclick="changeLevel('menengah', this)">Menengah</button>
      <button class="level-btn" onclick="changeLevel('pro', this)">Pro</button>
    </div>

    <div class="chat-area" id="chatBox"></div>

    <div class="input-area">
      <button class="mic-btn" id="micBtn" onclick="toggleMic()" title="Bicara dengan suara">🎤</button>
      <input type="text" id="userInput" placeholder="Ketik pesan..." autocomplete="off">
      <button class="send-btn" onclick="sendMessage()">Kirim</button>
    </div>
  </div>

  <script>
    // ---------------------------------------------------------
    // MASUKKAN API KEY ANDA DI BAWAH INI
    // ---------------------------------------------------------
    const API_KEY = "AQ.Ab8RN6IskHyAd736lMv4VIG4naIm0xGYIh5ZIf7nUtSR9qhCuA"; 
    
    let currentLevel = 'pemula';
    let studentName = '';
    
    const levelInstructions = {
      pemula: "Kamu adalah guru bahasa Inggris yang ramah. Muridmu pemula (beginner). Gunakan bahasa Indonesia dominan untuk menjelaskan. Terjemahkan contoh kalimat ke bahasa Indonesia.",
      menengah: "Kamu tutor tingkat menengah (intermediate). Gunakan 70% bahasa Inggris dan 30% bahasa Indonesia. Ajak berdiskusi dan perbaiki tata bahasa.",
      pro: "You are an advanced English coach. Communicate 100% in English. Use complex vocabulary and idioms. Correct unnatural phrasing."
    };

    function startApp() {
      const nameInput = document.getElementById('studentNameInput').value.trim();
      if (!nameInput) { alert("Silakan isi nama Anda terlebih dahulu ya!"); return; }
      studentName = nameInput;
      
      document.getElementById('welcomeScreen').style.display = 'none';
      document.getElementById('appContainer').style.display = 'flex';

      const hour = new Date().getHours();
      let waktu = "malam";
      if (hour >= 4 && hour < 11) waktu = "pagi";
      else if (hour >= 11 && hour < 15) waktu = "siang";
      else if (hour >= 15 && hour < 18) waktu = "sore";

      const greetingMsg = `Selamat ${waktu} <b>${studentName}</b>! Saya siap membantu Anda berlatih bahasa Inggris. Anda bisa mengetik pesan atau menekan tombol mikrofon 🎤 untuk berbicara.`;
      
      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML = `
        <div class="message ai">
          ${greetingMsg} <br>
          <button class="btn-suara" onclick="bacaTeks('${encodeURIComponent(greetingMsg.replace(/<[^>]*>?/gm, ''))}', 'id-ID')">🔊 Dengarkan</button>
        </div>`;
    }

    function changeLevel(level, btnElement) {
      currentLevel = level;
      document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
      const chatBox = document.getElementById('chatBox');
      const levelName = level === 'pemula' ? 'Pemula' : level === 'menengah' ? 'Menengah' : 'Pro';
      chatBox.innerHTML += `<div class="message ai" style="background:#E0E7FF; border:none; text-align:center; align-self:center; width:100%;">Tingkat kesulitan diubah ke: <b>${levelName}</b></div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // --- FITUR TEXT-TO-SPEECH (Membaca Teks AI) ---
    function bacaTeks(teksTer-encode, bahasa) {
      const teks = decodeURIComponent(teksTer-encode);
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Hentikan suara sebelumnya jika ada
        const ucapan = new SpeechSynthesisUtterance(teks);
        // Pilih logat berdasarkan level (Pemula pakai suara Indo, Menengah/Pro pakai suara Inggris)
        ucapan.lang = bahasa; 
        window.speechSynthesis.speak(ucapan);
      } else {
        alert("Maaf, browser Anda tidak mendukung fitur membaca suara.");
      }
    }

    // --- FITUR SPEECH-TO-TEXT (Mikrofon) ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isRecording = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = function() {
        isRecording = true;
        document.getElementById('micBtn').classList.add('recording');
        document.getElementById('userInput').placeholder = "Mendengarkan ucapan Anda...";
      };

      recognition.onresult = function(event) {
        const hasilSuara = event.results[0][0].transcript;
        document.getElementById('userInput').value = hasilSuara;
        sendMessage(); // Otomatis kirim pesan setelah selesai bicara
      };

      recognition.onerror = function(event) { console.error("Error mic:", event.error); hentikanMic(); };
      recognition.onend = function() { hentikanMic(); };
    }

    function toggleMic() {
      if (!SpeechRecognition) { alert("Browser ini tidak mendukung mikrofon."); return; }
      if (isRecording) {
        recognition.stop();
      } else {
        // Jika level pemula, AI memahami suara campuran Indo-Inggris. Jika Pro, full English.
        recognition.lang = (currentLevel === 'pro') ? 'en-US' : 'id-ID';
        recognition.start();
      }
    }

    function hentikanMic() {
      isRecording = false;
      document.getElementById('micBtn').classList.remove('recording');
      document.getElementById('userInput').placeholder = "Ketik pesan...";
    }

    // --- KIRIM PESAN KE AI ---
    async function sendMessage() {
      const inputField = document.getElementById('userInput');
      const chatBox = document.getElementById('chatBox');
      const text = inputField.value.trim();
      
      if (!text) return;
      if (API_KEY === "GANTI_DENGAN_API_KEY_ANDA_YANG_DIAWALI_AQ") { alert("Silakan masukkan API Key di dalam kode!"); return; }

      chatBox.innerHTML += `<div class="message user">${text}</div>`;
      inputField.value = '';
      
      const loadingId = 'load-' + Date.now();
      chatBox.innerHTML += `<div class="message ai loading-text" id="${loadingId}">AI sedang berpikir...</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;

      const finalInstruction = levelInstructions[currentLevel] + `\n\nPENTING: Nama murid yang kamu ajar adalah "${studentName}". Ingat namanya. Jawablah sealami mungkin untuk percakapan.`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: finalInstruction }] },
            contents: [{ parts: [{ text: text }] }]
          })
        });
        
        const data = await response.json();
        if(data.error) throw new Error(data.error.message);

        const reply = data.candidates[0].content.parts[0].text;
        document.getElementById(loadingId).remove();
        
        // Membersihkan teks untuk dibaca mesin suara (menghilangkan tanda bintang atau hashtag)
        let teksBersihUntukSuara = reply.replace(/\*/g, '').replace(/#/g, '').replace(/<[^>]*>?/gm, '');
        // Tentukan logat baca mesin berdasarkan level
        let logatSuara = (currentLevel === 'pemula') ? 'id-ID' : 'en-US';

        const formattedReply = reply.replace(/\n/g, '<br>');
        
        chatBox.innerHTML += `
          <div class="message ai">
            ${formattedReply} <br>
            <button class="btn-suara" onclick="bacaTeks('${encodeURIComponent(teksBersihUntukSuara)}', '${logatSuara}')">🔊 Dengarkan</button>
          </div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
        
      } catch (error) {
        document.getElementById(loadingId).remove();
        chatBox.innerHTML += `<div class="message ai" style="color:red;">Error: Gagal terhubung ke AI.</div>`;
      }
    }

    document.getElementById("userInput").addEventListener("keypress", function(e) { if (e.key === "Enter") sendMessage(); });
    document.getElementById("studentNameInput").addEventListener("keypress", function(e) { if (e.key === "Enter") startApp(); });
  </script>
</body>
</html>
