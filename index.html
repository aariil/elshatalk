<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ELSHA - English AI Tutor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            margin: 0;
            overflow-x: hidden;
            /* Prevent bounce effect on mobile */
            overscroll-behavior-y: none; 
        }
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .sidebar-mobile {
            background: rgba(102, 126, 234, 0.95);
            backdrop-filter: blur(16px);
        }
        .chat-bubble-ai {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 1rem 1rem 1rem 0.2rem;
        }
        .chat-bubble-user {
            background: rgba(99, 102, 241, 0.8);
            border-radius: 1rem 1rem 0.2rem 1rem;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 10px; }
        
        /* Ensure text breaks properly on small screens */
        .break-words { word-break: break-word; }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center p-0 md:p-4">

            <div class="mb-6 flex justify-center">
                <div class="w-20 h-20 bg-white/20 rounded-2xl flex items-center justify-center shadow-lg transform rotate-3">
                    <i class="fas fa-language text-4xl text-white"></i>
                </div>
            </div>
